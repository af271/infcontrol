[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infcontrol"
version = "0.1.0"
description = "Symbolic inference-control utilities and operators"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

william = [
  "william",
]

[project.scripts]
infcontrol-predict = "infcontrol.predict_cli:main"

[tool.setuptools]
packages = ["infcontrol"]

[tool.setuptools.package-dir]
infcontrol = "."

[tool.setuptools.package-data]
infcontrol = ["data/*.json", "data/*.metta", "models/**/*.dot", "models/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
